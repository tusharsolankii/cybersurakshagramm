<style>
/* Layout: a village-road journey. Sticky header with festival bunting, one lesson per screen, big Back/Next bar at the bottom, a turbaned guide (Suraksha Dada) speaks on every screen. */
:root{
  --bg:#F1F6E8; --surface:#FFFFFF; --ink:#1B2740; --muted:#52607A; --line:#D5DEC3;
  --brand:#2A3F9D; --on-brand:#FFFFFF; --sun:#F4A300; --on-sun:#2A1B00; --leaf:#2E7B4B; --alert:#C42B2B;
  --warm:#FDEFC2; --good-bg:#E2F3E6; --bad-bg:#FBE4E1; --info-bg:#E5EAFB;
  --sky:#CDE7F4; --hill1:#9CCB93; --hill2:#6DAA73; --mud:#C58A5B; --thatch:#9B6B2A; --skin:#B77B50; --road:#E4D3A8;
  --display:'Baloo 2','Hind','Noto Sans Devanagari',system-ui,sans-serif;
  --body:'Hind','Noto Sans Devanagari',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A15; --surface:#1A251E; --ink:#EAF0E4; --muted:#A3B09F; --line:#2E3C32;
    --brand:#9AAAFF; --on-brand:#10163A; --sun:#FFC43D; --on-sun:#2A1B00; --leaf:#6FCB8E; --alert:#FF8179;
    --warm:#3A3114; --good-bg:#18382A; --bad-bg:#40201E; --info-bg:#1F2748;
    --sky:#1D3347; --hill1:#2D5A3C; --hill2:#234A31; --mud:#8A5E3E; --thatch:#7A5420; --road:#3C3524;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A15; --surface:#1A251E; --ink:#EAF0E4; --muted:#A3B09F; --line:#2E3C32;
  --brand:#9AAAFF; --on-brand:#10163A; --sun:#FFC43D; --on-sun:#2A1B00; --leaf:#6FCB8E; --alert:#FF8179;
  --warm:#3A3114; --good-bg:#18382A; --bad-bg:#40201E; --info-bg:#1F2748;
  --sky:#1D3347; --hill1:#2D5A3C; --hill2:#234A31; --mud:#8A5E3E; --thatch:#7A5420; --road:#3C3524;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800} h2{font-size:1.55rem;font-weight:800} h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.ic{width:1.5em;height:1.5em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:1.15em;height:1.15em}
.ic.lg{width:2.2em;height:2.2em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-row{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--brand);min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{display:flex;border:2px solid var(--brand);border-radius:999px;overflow:hidden;flex:none}
.lang button{font:600 .95rem var(--body);padding:6px 12px;border:0;background:transparent;color:var(--brand);cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.toran{height:7px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:repeating-linear-gradient(90deg,var(--sun) 0 14px,var(--alert) 14px 28px,var(--brand) 28px 42px,var(--leaf) 42px 56px)}
.road{max-width:720px;margin:0 auto;padding:8px 0 10px}
.road-label{font-size:.9rem;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.dots{display:flex;gap:6px;margin-top:6px}
.dot{flex:1;height:10px;border-radius:6px;background:var(--line);border:0;padding:0;cursor:default}
.dot.done{background:var(--leaf);cursor:pointer}
.dot.now{background:var(--sun)}

main{max-width:720px;margin:0 auto;padding-top:18px;display:flex;flex-direction:column;gap:18px;outline:none}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}*{transition:none!important}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card.warm{background:var(--warm)}
.scene{width:100%;height:auto;border-radius:18px;display:block}

/* guide */
.guide{display:flex;gap:10px;align-items:flex-end}
.guide .face{width:76px;height:76px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--sun);border-radius:18px 18px 18px 4px;padding:12px 14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.bubble .who{font-family:var(--display);font-weight:700;color:var(--brand);font-size:.95rem}

/* buttons */
.btn{font:700 1.1rem var(--body);min-height:56px;padding:12px 20px;border-radius:16px;border:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--brand)}
.btn.small{min-height:44px;font-size:1rem;padding:8px 14px;border-radius:12px}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* forms */
label{font-weight:600;display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;font:500 1.1rem var(--body);padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus{border-color:var(--brand);outline:none}
.err{color:var(--alert);font-weight:600;min-height:1.4em}
.fine{font-size:.92rem;color:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 1.02rem var(--body);cursor:pointer;min-height:104px;min-width:0}
.tile .disc{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tile.on{border-color:var(--brand);background:var(--info-bg)}
.tile .seen{margin-left:auto;color:var(--leaf)}
.c1{background:#2A3F9D}.c2{background:#C42B2B}.c3{background:#2E7B4B}.c4{background:#B7790A}.c5{background:#7A3E9D}.c6{background:#0F7F8C}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* lists */
.flags,.dos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.flags li,.dos li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;min-width:0}
.flags li{background:var(--bad-bg)} .flags .ic{color:var(--alert);margin-top:2px}
.dos li{background:var(--good-bg)} .dos .ic{color:var(--leaf);margin-top:2px}
.say{background:var(--bad-bg);border-radius:16px 16px 16px 4px;padding:14px;border:2px dashed var(--alert);font-weight:500}
.chan{font-size:.85rem;font-weight:700;color:var(--alert);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.head-good{color:var(--leaf)} .head-bad{color:var(--alert)}
.sec-title{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.1rem}

/* dos & donts */
.acc{border:2px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:0;background:transparent;color:var(--ink);font:700 1.1rem var(--display);cursor:pointer;text-align:left;min-height:64px}
.acc>button .disc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.acc>button .chev{margin-left:auto;transition:transform .2s}
.acc.open{border-color:var(--brand)} .acc.open .chev{transform:rotate(90deg)}
.acc .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}

/* checker */
.verdict{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.verdict.danger{background:var(--bad-bg);border:2px solid var(--alert)}
.verdict.careful{background:var(--warm);border:2px solid var(--sun)}
.verdict.safe{background:var(--good-bg);border:2px solid var(--leaf)}
.verdict .big{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:1.6rem}
.danger .big{color:var(--alert)} .careful .big{color:var(--on-sun)} .safe .big{color:var(--leaf)}
:root[data-theme="dark"] .careful .big{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .careful .big{color:var(--sun)}}
.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.chip{font:600 .98rem var(--body);padding:8px 14px;border-radius:999px;border:2px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer;min-height:42px;text-align:left}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* quiz */
.opt{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 1.05rem var(--body);cursor:pointer;text-align:left;min-height:62px}
.opt .k{width:34px;height:34px;border-radius:50%;background:var(--info-bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--brand);flex:none}
.opt.right{border-color:var(--leaf);background:var(--good-bg)}
.opt.wrong{border-color:var(--alert);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.bar-q{height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.bar-q i{display:block;height:100%;background:var(--sun);border-radius:8px;transition:width .3s}
.explain{padding:12px 14px;border-radius:14px;background:var(--info-bg)}
.medal{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.medal svg{width:150px;height:auto}
.score{font-family:var(--display);font-weight:800;font-size:2.6rem;color:var(--brand)}

/* help */
.call{background:var(--alert);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
:root[data-theme="dark"] .call{background:#8F1F1F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .call{background:#8F1F1F}}
.call .num{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:.04em}
.call .btn{background:#fff;color:#8F1F1F}
.step{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 1.02rem var(--body);cursor:pointer;text-align:left}
.step .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--brand);display:grid;place-items:center;flex:none;color:transparent}
.step.ticked{background:var(--good-bg);border-color:var(--leaf)}
.step.ticked .box{background:var(--leaf);border-color:var(--leaf);color:#fff}

/* feedback */
.stars{display:flex;gap:6px}
.stars button{background:transparent;border:0;cursor:pointer;color:var(--line);padding:4px}
.stars button.on{color:var(--sun)}
.stars .ic{width:2.4em;height:2.4em;fill:currentColor}
.cert{border:3px double var(--sun);border-radius:18px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.cert .nm{font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--brand)}

/* nav bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1}
.bar .btn.next{flex:2}
.bar .btn small{display:block;font-weight:500;font-size:.8rem;opacity:.9}
</style>

var NOTICE=/(do not|don't|never) share|न बताएं|न बताएँ|साझा न करें|किसी को न दें|किसी को न बता/i;
var OFFICIAL=/(gov\.in|nic\.in|sbi\.co\.in|onlinesbi\.sbi|hdfcbank\.com|icicibank\.com|npci\.org\.in)/i;
var RULES=[
 {id:"otp",w:5,hard:true,skipOnNotice:true,re:/\botp\b|ओटीपी|one.?time pass/i,

 {id:"pin",w:4,hard:false,skipOnNotice:true,re:/\bpin\b|पिन|\bcvv\b|password|पासवर्ड/i,
  m:["PIN, पासवर्ड या CVV का ज़िक्र है।","It mentions a PIN, password or CVV."]},
 {id:"urg",w:2,re:/urgent|immediately|right now|tonight|within \d+ ?(hour|hrs|min)|last chance|expire|अभी|तुरंत|जल्दी|आज रात|आज ही|फौरन|फ़ौरन|वरना|24 घंटे/i,
  m:["जल्दबाज़ी मचाई गई है। ठग सोचने का समय नहीं देते।","It rushes you. Scammers do not give you time to think."]},
 {id:"thr",w:2,re:/(account|खाता|खाते|sim|सिम|बिजली|electricity|card|कार्ड|upi|pan|पैन|aadhaar|आधार|kyc).{0,45}(block|suspend|deactivat|expire|बंद|ब्लॉक|कट जाएगी|कट जाएगा|कटेगी|कटेगा)|(block|suspend|बंद|ब्लॉक).{0,45}(account|खाता|खाते|sim|सिम)/i,
  m:["खाता या सेवा बंद होने का डर दिखाया गया है।","It scares you with a blocked account or service."]},
 {id:"kyc",w:2,re:/\bkyc\b|केवाईसी/i,
  m:["KYC अपडेट के नाम पर संदेश है। असली KYC बैंक शाखा में होता है।","It uses “KYC update” as bait. Real KYC is done at the branch."]},
 {id:"prz",w:3,re:/lottery|lucky draw|you have won|you won|congratulations|jackpot|लॉटरी|इनाम|ईनाम|जीत|बधाई|कैशबैक|लकी ड्रा/i,
  m:["इनाम या लॉटरी का लालच है।","It tempts you with a prize or lottery."]},
 {id:"fee",w:3,re:/(registration|processing|joining|insurance|delivery|customs|claim) ?(fee|charge)|फीस|फ़ीस|शुल्क|चार्ज|advance|security deposit/i,
  m:["पहले पैसे या फ़ीस माँगी जा रही है।","It asks for money or a fee first."]},
 {id:"snd",w:2,re:/(send|transfer|pay|refund|return).{0,30}(₹|rs\.?|rupees|money|amount)|(पैसे|रुपये|₹|रकम).{0,30}(भेज|वापस|लौटा|जमा)|गलती से|by mistake/i,
  m:["पैसे भेजने या लौटाने को कहा गया है।","It asks you to send or return money."]},
 {id:"short",w:3,re:/(bit\.ly|tinyurl|t\.co|goo\.gl|cutt\.ly|rb\.gy|is\.gd|shorturl|tiny\.cc)\S*/i,

 {id:"apk",w:5,hard:true,re:/\.apk\b/i,
  m:[".apk फ़ाइल है। यह नकली ऐप फ़ोन में डाल सकती है।","It has an .apk file, which can install a fake app."]},
 {id:"rem",w:5,hard:true,re:/anydesk|teamviewer|quicksupport|rustdesk/i,

 {id:"sec",w:2,re:/don'?t tell|do not tell|किसी को मत बताना|किसी को न बताना|गोपनीय|secret/i,
  m:["बात छिपाने को कहा गया है।","It asks you to keep it secret."]}

function analyze(raw){
  var t=raw.trim(), notice=NOTICE.test(t), score=0, hard=false, bad=[], good=[];
  RULES.forEach(function(r){
    if(r.skipOnNotice&&notice)return;
    if(r.re.test(t)){score+=r.w;if(r.hard)hard=true;bad.push(r.m)}
  });
  var links=t.match(/(?:https?:\/\/|www\.)[^\s]+/gi)||[];
  var odd=links.filter(function(l){return !OFFICIAL.test(l)&&!/(bit\.ly|tinyurl|t\.co|goo\.gl|cutt\.ly|rb\.gy|is\.gd|shorturl|tiny\.cc)/i.test(l)});
  if(odd.length){score+=2;bad.push(["अनजान वेबसाइट का लिंक है। खोलने से पहले रुकें।","It has an unknown website link. Pause before opening it."])}
  if(links.length&&!odd.length&&!/(bit\.ly|tinyurl|t\.co|goo\.gl|cutt\.ly|rb\.gy|is\.gd|shorturl|tiny\.cc)/i.test(t)){good.push(["लिंक सरकारी या जाने-पहचाने बैंक का दिखता है, फिर भी वेबसाइट खुद टाइप करके खोलें।","The link looks official, still type the website yourself."])}
  if(/(call|contact|कॉल|संपर्क).{0,30}\+?\d[\d\s-]{8,}/i.test(t)){score+=1;bad.push(["अनजान नंबर पर फ़ोन करने को कहा है।","It tells you to call an unknown number."])}
  if(notice){good.push(["संदेश खुद कहता है कि OTP या PIN किसी को न बताएँ। असली बैंक ऐसा लिखते हैं।","The message itself warns you not to share the OTP or PIN. Real banks write this."])}
  var v=(hard||score>=5)?"danger":(score>=2?"careful":"safe");
  return {v:v,bad:bad,good:good,score:score};
}

  if(S.quizDone){
    var b=badge();
    return guide(P(b.m))+
    '<div class="card medal fade"><h2>'+T("आपका नतीजा","Your result")+'</h2><div class="score">'+S.score+' / '+QZ.length+'</div>'+medalSvg(b.c)+'<h3>'+P(b.n)+'</h3>'+
     '<button type="button" class="btn ghost" data-a="quizRetry">'+ic("redo")+T("फिर से खेलें","Play again")+'</button></div>';
  }
  var q=QZ[S.q], ans=S.picked!==null;
  return guide(T("10 सवाल हैं। एक-एक करके जवाब दीजिए। गलत हो तो भी घबराइए नहीं, मैं समझा दूँगा।","There are 10 questions. Answer one by one. If you get one wrong, I will explain."))+
  '<div class="card"><div class="spread"><b>'+T("सवाल ","Question ")+(S.q+1)+' / '+QZ.length+'</b><span class="fine">'+T("अंक: ","Score: ")+S.score+'</span></div>'+
   '<div class="bar-q" aria-hidden="true"><i style="width:'+(S.q/QZ.length*100)+'%"></i></div>'+
   '<h3>'+P(q.q)+'</h3>'+
   q.o.map(function(o,i){
     var cls="opt"; if(ans){if(i===q.a)cls+=" right";else if(i===S.picked)cls+=" wrong"}
     return '<button type="button" class="'+cls+'" data-a="pick" data-v="'+i+'"'+(ans?" disabled":"")+'><span class="k">'+"ABC"[i]+'</span><span>'+P(o)+'</span>'+(ans&&i===q.a?'<span style="margin-left:auto;color:var(--leaf)">'+ic("check")+'</span>':"")+(ans&&i===S.picked&&i!==q.a?'<span style="margin-left:auto;color:var(--alert)">'+ic("x")+'</span>':"")+'</button>';
   }).join("")+
   (ans?'<div class="explain fade"><b>'+(S.picked===q.a?T("सही जवाब! ","Correct! "):T("सही जवाब ऊपर हरे में है। ","The right answer is green. "))+'</b>'+P(q.e)+'</div>'+
     '<button type="button" class="btn sun block" data-a="qnext">'+(S.q===QZ.length-1?T("नतीजा देखें","See result"):T("अगला सवाल","Next question"))+ic("next")+'</button>':"")+
  '</div>';
};

function shareUrl(){var u="";try{u=location.href}catch(e){}return /^https?:/.test(u)?u:""}
function shareBlock(){
  var u=shareUrl();
  var txt=T("साइबर सुरक्षा ग्राम: ठगी से बचना सीखिए।","Cyber Suraksha Gram: learn to stay safe from fraud.")+(u?" "+u:"");
  return '<div class="card"><div class="sec-title">'+ic("share")+T("परिवार को भेजें","Share with family")+'</div>'+
   '<p>'+T("गाँव में जितने ज़्यादा लोग सीखेंगे, उतने कम लोग ठगे जाएँगे।","The more people learn in the village, the fewer get cheated.")+'</p>'+
   '<div class="row"><a class="btn primary" style="flex:1" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt)+'">'+ic("share")+T("WhatsApp पर भेजें","Send on WhatsApp")+'</a>'+
   '<button type="button" class="btn ghost" data-a="copy" data-v="'+esc(txt)+'">'+ic("copy")+T("कॉपी करें","Copy")+'</button></div>'+
   '<div class="fine" id="copyNote" aria-live="polite"></div></div>';
}

V.help=function(){
  var n=S.checks.length;
  return guide(T("अगर ठगी हो जाए तो घबराइए मत। जल्दी मदद माँगिए। यह सूची एक-एक करके पूरी कीजिए।","If you are cheated, do not panic. Ask for help quickly. Tick each step as you do it."))+
  '<div class="call"><div class="sec-title" style="color:#fff">'+ic("alert")+T("साइबर क्राइम हेल्पलाइन","Cyber crime helpline")+'</div>'+
   '<div class="num" id="num1930">1930</div><p>'+T("ठगी होते ही यहाँ फ़ोन करें। जितनी जल्दी रिपोर्ट करेंगे, पैसा रुकने की संभावना उतनी बेहतर।","Call as soon as it happens. The sooner you report, the better the chance to stop the money.")+'</p>'+
   '<div class="row"><a class="btn" href="tel:1930">'+ic("phone")+T("1930 पर कॉल","Call 1930")+'</a><button type="button" class="btn small" data-a="copy" data-v="1930">'+ic("copy","sm")+T("नंबर कॉपी","Copy number")+'</button></div></div>'+
  '<div class="card"><div class="sec-title">'+ic("globe")+T("ऑनलाइन शिकायत","Report online")+'</div>'+
   '<p>'+T("वेबसाइट: ","Website: ")+'<b>cybercrime.gov.in</b></p>'+
   '<a class="btn ghost" target="_blank" rel="noopener" href="https://cybercrime.gov.in">'+ic("globe")+T("पोर्टल खोलें","Open the portal")+'</a></div>'+
  '<div class="card"><div class="spread"><h2>'+T("पैसे कट जाएँ तो ये करें","If money is lost, do this")+'</h2><span class="fine">'+n+'/'+HELP_STEPS.length+'</span></div>'+
   HELP_STEPS.map(function(s,i){var on=S.checks.indexOf(i)>-1;return '<button type="button" class="step'+(on?" ticked":"")+'" data-a="tick" data-v="'+i+'" aria-pressed="'+on+'"><span class="box">'+ic("check","sm")+'</span><span>'+P(s)+'</span></button>'}).join("")+
   '<p class="fine">'+T("पास के पुलिस थाने में भी जा सकते हैं। बैंक का हेल्पलाइन नंबर कार्ड के पीछे लिखा होता है।","You can also visit the nearest police station. Your bank’s helpline is printed on the back of your card.")+'</p></div>'+
  shareBlock();
};

V.feedback=function(){
  if(S.done){
    var b=S.quizDone?badge():null;
    return guide(T("धन्यवाद <b>"+esc(S.name||"")+"</b> जी! अब आप दूसरों को भी बचा सकते हैं।","Thank you <b>"+esc(S.name||"")+"</b>! Now you can protect others too."))+
    '<div class="cert fade">'+ic("shield","lg")+'<div class="fine">'+T("साइबर सुरक्षा ग्राम","Cyber Suraksha Gram")+'</div><div class="fine">'+T("यह प्रमाणित करता है कि","This is to certify that")+'</div>'+
     '<div class="nm">'+esc(S.name||T("साथी","Friend"))+'</div>'+(S.village?'<div>'+T("गाँव: ","Village: ")+esc(S.village)+'</div>':"")+
     '<div>'+T("ने साइबर सुरक्षा का पाठ पूरा किया","has completed the cyber safety lessons")+'</div>'+
     (b?'<div style="display:flex;justify-content:center">'+'<div class="medal" style="gap:2px">'+medalSvg(b.c).replace("<svg ","<svg style=\"width:90px\" ")+'<b>'+P(b.n)+' · '+S.score+'/'+QZ.length+'</b></div></div>':'<div class="fine">'+T("क्विज़ अभी बाकी है।","The quiz is still pending.")+'</div>')+'</div>'+
    '<p class="fine" style="text-align:center">'+T("आपकी राय इसी फ़ोन में सहेजी गई है।","Your feedback is saved on this phone only.")+'</p>'+
    shareBlock()+
    '<button type="button" class="btn ghost block" data-a="restart">'+ic("redo")+T("शुरू से दोबारा देखें","Start again from the beginning")+'</button>';
  }
  return guide(T("आख़िर में आपकी राय चाहिए, ताकि अगली बार और अच्छा बना सकें।","Last, we would like your opinion so we can make it better."))+
  '<div class="card"><h2>'+T("आपकी राय","Your feedback")+'</h2>'+
   '<div><div style="font-weight:600;margin-bottom:6px">'+T("यह पाठ कैसा लगा?","How was this lesson?")+'</div>'+
    '<div class="stars" role="group" aria-label="'+T("रेटिंग","Rating")+'">'+[1,2,3,4,5].map(function(i){return '<button type="button" class="'+(i<=S.rating?"on":"")+'" data-a="rate" data-v="'+i+'" aria-label="'+i+'">'+ic("star")+'</button>'}).join("")+'</div></div>'+
   '<div><div style="font-weight:600;margin-bottom:6px">'+T("सबसे ज़्यादा क्या पसंद आया?","What did you like most?")+'</div><div class="row">'+LIKES.map(function(l,i){return '<button type="button" class="chip" data-a="like" data-v="'+i+'" aria-pressed="'+(S.likes.indexOf(i)>-1)+'">'+P(l)+'</button>'}).join("")+'</div></div>'+
   '<div><label for="fbText">'+T("कुछ और कहना है? (ज़रूरी नहीं)","Anything else? (optional)")+'</label><textarea id="fbText" style="min-height:100px" placeholder="'+T("यहाँ लिखें…","Write here…")+'">'+esc(S.comment)+'</textarea></div>'+
   '<div class="err" id="fbErr" role="alert"></div>'+
   '<button type="button" class="btn sun block" data-a="submitFb">'+ic("check")+T("राय भेजें","Submit feedback")+'</button></div>';
};

/* ---------- render ---------- */
function render(scrollTop){
  var k=STEPS[S.step].k;
  $("#brandName").textContent=T("साइबर सुरक्षा ग्राम","Cyber Suraksha Gram");
  $("#lhi").setAttribute("aria-pressed",S.lang==="hi");$("#len").setAttribute("aria-pressed",S.lang==="en");
  document.documentElement.lang=S.lang==="hi"?"hi":"en";
  var st=$("#stage");
  st.innerHTML=V[k]();
  if(scrollTop){st.classList.remove("fade");void st.offsetWidth;st.classList.add("fade");window.scrollTo(0,0);try{st.focus({preventScroll:true})}catch(e){}}
  /* road */
  var road=$("#road");
  if(S.step===0){road.hidden=true}else{
    road.hidden=false;
    road.innerHTML='<div class="road-label"><span>'+T("पाठ ","Lesson ")+S.step+' / '+(STEPS.length-1)+'</span><span>'+P(STEPS[S.step].n)+'</span></div><div class="dots">'+
      STEPS.slice(1).map(function(s,i){var n=i+1;var c=n===S.step?"now":(n<=S.max?"done":"");return '<button type="button" class="dot '+c+'" '+(n<=S.max?'data-a="go" data-v="'+n+'"':"disabled")+' aria-label="'+esc(P(s.n))+'"></button>'}).join("")+'</div>';
  }
  /* bottom bar */
  var bar=$("#bar");
  if(S.step===0){bar.hidden=true;document.body.style.paddingBottom="32px"}else{
    bar.hidden=false;document.body.style.paddingBottom="120px";
    var last=S.step===STEPS.length-1;
    var nxt=STEPS[S.step+1];
    $("#barIn").innerHTML='<button type="button" class="btn ghost" data-a="back">'+ic("back")+T("पीछे","Back")+'</button>'+
      (last?"":'<button type="button" class="btn primary next" data-a="next"><span>'+T("आगे","Next")+'<small>'+P(nxt.n)+'</small></span>'+ic("next")+'</button>');
  }
}
function go(n){S.step=Math.max(0,Math.min(STEPS.length-1,n));if(S.step>S.max)S.max=S.step;if(STEPS[S.step].k==="scams"&&S.scamSeen.indexOf(S.scam)<0)S.scamSeen.push(S.scam);render(true)}
function keepScroll(fn){var y=window.scrollY;fn();window.scrollTo(0,y)}
function grabText(){var t=$("#msgText");if(t)S.text=t.value;var f=$("#fbText");if(f)S.comment=f.value}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v;
  if(a==="lang"){grabText();S.lang=v;save();keepScroll(function(){render(false)});return}
  if(a==="go"){grabText();go(+v);return}
  if(a==="next"){grabText();go(S.step+1);return}
  if(a==="back"){grabText();go(S.step-1);return}
  if(a==="scam"){S.scam=+v;if(S.scamSeen.indexOf(S.scam)<0)S.scamSeen.push(S.scam);keepScroll(function(){render(false)});$("#scamCard").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(a==="scamNext"){S.scam=(S.scam+1)%SCAMS.length;if(S.scamSeen.indexOf(S.scam)<0)S.scamSeen.push(S.scam);render(false);$("#stage").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(a==="analyze"){grabText();S.result=S.text.trim()?analyze(S.text):{empty:true};keepScroll(function(){render(false)});var o=$("#checkOut");if(o)o.scrollIntoView({behavior:"smooth",block:"center"});return}
  if(a==="clear"){S.text="";S.result=null;keepScroll(function(){render(false)});return}
  if(a==="sample"){S.text=P([SAMPLES[+v][2],SAMPLES[+v][3]]);S.result=analyze(S.text);keepScroll(function(){render(false)});var o2=$("#checkOut");if(o2)o2.scrollIntoView({behavior:"smooth",block:"center"});return}
  if(a==="dos"){var i=+v;S.dosOpen=S.dosOpen===i?-1:i;if(S.dosSeen.indexOf(i)<0)S.dosSeen.push(i);keepScroll(function(){render(false)});return}
  if(a==="pick"){if(S.picked!==null)return;S.picked=+v;if(+v===QZ[S.q].a)S.score++;keepScroll(function(){render(false)});return}
  if(a==="qnext"){S.picked=null;if(S.q===QZ.length-1){S.quizDone=true}else{S.q++}render(true);return}
  if(a==="quizRetry"){S.q=0;S.score=0;S.picked=null;S.quizDone=false;render(true);return}
  if(a==="tick"){var j=+v,x=S.checks.indexOf(j);if(x>-1)S.checks.splice(x,1);else S.checks.push(j);keepScroll(function(){render(false)});return}
  if(a==="rate"){grabText();S.rating=+v;keepScroll(function(){render(false)});return}
  if(a==="like"){grabText();var l=+v,y=S.likes.indexOf(l);if(y>-1)S.likes.splice(y,1);else S.likes.push(l);keepScroll(function(){render(false)});return}
  if(a==="submitFb"){grabText();
    if(!S.rating){var er=$("#fbErr");if(er)er.textContent=T("कृपया तारे दबाकर रेटिंग दीजिए।","Please tap the stars to give a rating.");return}
    try{localStorage.setItem("csg-feedback",JSON.stringify({rating:S.rating,likes:S.likes,comment:S.comment,at:Date.now()}))}catch(err){}
    S.done=true;render(true);return}
  if(a==="restart"){S.step=1;S.q=0;S.score=0;S.picked=null;S.quizDone=false;S.scam=0;S.scamSeen=[];S.dosOpen=-1;S.dosSeen=[];S.checks=[];S.result=null;S.text="";S.rating=0;S.likes=[];S.comment="";S.done=false;S.max=1;render(true);return}
  if(a==="copy"){
    var txt=b.dataset.v,note=$("#copyNote");
    var ok=function(){if(note)note.textContent=T("कॉपी हो गया।","Copied.");b.blur()};
    var bad=function(){if(note)note.textContent=T("कॉपी नहीं हो सका। टेक्स्ट को दबाकर खुद कॉपी करें।","Could not copy. Press and hold the text to copy it.")};
    try{navigator.clipboard.writeText(txt).then(ok,bad)}catch(err){bad()}
    return}
  if(a==="speak"){var g=$("#gtxt");if(!g)return;try{var u=new SpeechSynthesisUtterance(g.textContent);u.lang=S.lang==="hi"?"hi-IN":"en-IN";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(err){}return}
});
document.addEventListener("submit",function(e){
  if(e.target.id!=="loginForm")return;
  e.preventDefault();
  var n=$("#inName").value.trim(),v=$("#inVillage").value.trim();
  if(!n){S.err=T("कृपया अपना नाम लिखिए","Please enter your name");$("#loginErr").textContent=S.err;$("#inName").focus();return}
  S.err="";S.name=n;S.village=v;save();go(1);
});

render(true);
</script>

</body></html>
